<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🗺️ Londres magique · dossier secret</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif}#map{height:100%}.top{position:fixed;z-index:1000;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.title,.back,.filters button{background:#101814ed;border:1px solid #eed28b99;color:#f3d98f;box-shadow:0 8px 24px #0006}.title{pointer-events:auto;border-radius:18px;padding:12px 16px}.eyebrow{font-size:9px;letter-spacing:.18em;text-transform:uppercase}.title h1{font:600 27px Georgia,serif;margin:4px 0}.title p{font-size:11px;margin:4px 0;color:#e8e0d0}.back{pointer-events:auto;border-radius:50%;width:45px;height:45px;display:grid;place-items:center;text-decoration:none;font-size:20px}.filters{position:fixed;z-index:1000;left:14px;right:14px;bottom:15px;display:flex;gap:8px;overflow:auto}.filters button{white-space:nowrap;border-radius:999px;padding:10px 13px;font-size:11px}.filters .active{background:#d7b45d;color:#152018}.leaflet-control-zoom{margin-top:90px!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#18231d;color:#f5ead8;border:1px solid #d7b45d}.cat{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#d7b45d}.pt{font:600 21px Georgia,serif;color:#f3d98f;margin:5px 0}.tx{font-size:12px;line-height:1.5}.link{color:#f3d98f;font-size:11px}@media(max-width:650px){.title h1{font-size:21px}.title p{max-width:230px}.leaflet-control-zoom{margin-top:105px!important}}</style></head><body><div id="map"></div><div class="top"><div class="title"><div class="eyebrow">🔐 Dossier secret · Londres</div><h1>Sur les traces de la magie</h1><p>Une carte interactive pour explorer les lieux de tournage, inspirations, boutiques et coins à l’ambiance magique.</p></div><a class="back" href="london-mood.html">×</a></div><div class="filters"><button class="active" data-f="all">✨ Tout</button><button data-f="film">🎬 Tournage</button><button data-f="inspire">🕯️ Inspirations</button><button data-f="shop">🛍️ Merch</button><button data-f="vibe">☕ Ambiance</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([51.509,-0.115],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const P=[['film',51.5127,-.0838,'Leadenhall Market','Décor du premier film : l’entrée de la boutique Leaky Cauldron.','Leadenhall Market London'],['film',51.5033,-.1196,'Millennium Bridge','Le célèbre pont apparaît dans Le Prince de Sang-Mêlé.','Millennium Bridge London'],['film',51.5186,-.1217,'Australia House','L’intérieur a servi de décor à la banque Gringotts.','Australia House London'],['film',51.5321,-.1234,'King’s Cross','La mythique voie 9¾ et son univers ferroviaire.','Harry Potter Platform 9 3/4 Kings Cross'],['inspire',51.5358,-.1545,'London Zoo · Reptile House','Associé à l’inspiration de la scène des serpents.','London Zoo Reptile House'],['inspire',51.5107,-.1340,'St Pancras Renaissance Hotel','Une architecture gothique qui donne une vraie impression de château anglais.','St Pancras Renaissance Hotel London'],['inspire',51.5136,-.1421,'Cecil Court','Rue historique de librairies et boutiques mystérieuses, parfaite pour une balade façon Chemin de Traverse.','Cecil Court London'],['shop',51.5321,-.1235,'Harry Potter Shop · King’s Cross','Boutique officielle : robes, baguettes, cadeaux et souvenirs.','Harry Potter Shop Kings Cross'],['shop',51.5152,-.1298,'House of Spells','Boutique pop culture fantastique avec une sélection Harry Potter.','House of Spells London'],['shop',51.5136,-.1318,'Forbidden Planet','Grande adresse pop culture pour figurines, livres et objets de collection.','Forbidden Planet London'],['vibe',51.5119,-.1267,'Goodwin’s Court','Petite cour pavée et cachée, parfaite pour une photo très vieux Londres.','Goodwins Court London'],['vibe',51.5142,-.1283,'Neal’s Yard','Petite cour colorée près de Covent Garden pour une pause cosy.','Neals Yard London'],['vibe',51.5121,-.1280,'Covent Garden','Arcades, spectacles et lumières : parfait pour prolonger la balade.','Covent Garden London']];const C={film:'#b96d47',inspire:'#6d8f78',shop:'#b788c8',vibe:'#739bb6'},M=[];P.forEach(p=>{const i=L.divIcon({className:'',html:`<div style="width:17px;height:17px;border-radius:50%;background:${C[p[0]]};border:3px solid white;box-shadow:0 2px 8px #0008"></div>`,iconSize:[17,17],iconAnchor:[8,8]});const m=L.marker([p[1],p[2]],{icon:i}).bindPopup(`<div class="cat">${p[0]==='film'?'🎬 Tournage':p[0]==='inspire'?'🕯️ Inspiration':p[0]==='shop'?'🛍️ Merch':'☕ Ambiance'}</div><div class="pt">${p[3]}</div><div class="tx">${p[4]}</div><br><a class="link" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[5])}">📍 Ouvrir dans Google Maps</a>`);m.addTo(map);M.push([m,p[0]])});document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.f;M.forEach(([m,t])=>{if(f==='all'||f===t)m.addTo(map);else map.removeLayer(m)})});</script></body></html>
