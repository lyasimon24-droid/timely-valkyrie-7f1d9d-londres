name: Add interactive suitcase section

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add interactive valises section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          .suitcases{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
          .suitcase-card{position:relative;border:0;border-radius:28px;padding:0;background:transparent;cursor:pointer;perspective:900px;text-align:left;color:var(--ink)}
          .case-shell{min-height:285px;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .35s ease,box-shadow .35s ease;position:relative;overflow:hidden;border:2px solid #ffffff80}
          .suitcase-card:hover .case-shell{transform:translateY(-6px) rotate(-1deg);box-shadow:0 25px 55px #35271b30}
          .case-shell.pink{background:linear-gradient(145deg,#f3b7c9,#df8fae)}
          .case-shell.green{background:linear-gradient(145deg,#b8c9b1,#78967b)}
          .case-shell.terra{background:linear-gradient(145deg,#d99672,#b96532)}
          .case-handle{width:58px;height:25px;border:6px solid currentColor;border-bottom:0;border-radius:12px 12px 0 0;margin:0 auto -2px;opacity:.7}
          .case-body{border:2px solid #ffffff70;border-radius:18px;height:190px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#ffffff18;position:relative}
          .case-body:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ffffff45}
          .case-lock{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);width:15px;height:18px;border-radius:3px;background:#fff8;border:1px solid #fff}
          .case-name{font:700 43px/1 'Cormorant Garamond';text-align:center;position:relative;z-index:1}
          .case-icon{font-size:42px;position:relative;z-index:1;margin-bottom:8px}
          .case-open{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;text-align:center;margin-top:13px}
          .packing{margin-top:18px;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease,opacity .3s ease;opacity:0}
          .packing-inner{overflow:hidden}
          .suitcase-card.open .packing{grid-template-rows:1fr;opacity:1}
          .packing-box{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
          .packing-box h3{font:600 31px 'Cormorant Garamond';color:var(--forest);margin:0 0 15px}
          .checklist{display:grid;gap:9px}
          .check{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#e8e2d6;font-size:12px;cursor:pointer}
          .check input{accent-color:var(--forest);width:17px;height:17px}.check:has(input:checked){text-decoration:line-through;opacity:.55}
          .packing-hint{font-size:10px;color:var(--muted);margin-top:13px}
          @media(max-width:700px){.suitcases{grid-template-columns:1fr}.case-shell{min-height:250px}.case-body{height:165px}}
          '''
          s = s.replace('</style>', css + '</style>', 1)

          nav_old = '<a href="#budget"><span class="ico">£</span>Budget</a>'
          nav_new = nav_old + '\n<a href="#valise"><span class="ico">🧳</span>Valise</a>'
          s = s.replace(nav_old, nav_new, 1)

          menu_old = '<a class="card" href="#budget">06 £<h2>Le budget</h2><span class="go">ouvrir →</span></a>'
          menu_new = menu_old + '<a class="card" href="#valise">07 🧳<h2>La valise</h2><span class="go">ouvrir →</span></a>'
          s = s.replace(menu_old, menu_new, 1)

          section = r'''
          <section class="soft" id="valise">
          <div class="eyebrow">07 · la valise</div>
          <h2 class="title">On n'oublie rien. 🧳</h2>
          <p>Choisis ta valise pour ouvrir ta checklist personnelle. Tu peux cocher les affaires au fur et à mesure des préparatifs ✨</p>
          <div class="suitcases">
            <button class="suitcase-card" type="button" aria-expanded="false" aria-controls="packing-lya" onclick="toggleCase(this)">
              <div class="case-shell pink"><div class="case-handle"></div><div class="case-body"><div class="case-icon">🌸</div><div class="case-name">Lya</div><div class="case-lock"></div></div><div class="case-open">ouvrir la valise · +</div></div>
              <div class="packing" id="packing-lya"><div class="packing-inner"><div class="packing-box"><h3>La valise de Lya 🌸</h3><div class="checklist">
                <label class="check"><input type="checkbox"> Passeport / pièce d'identité</label><label class="check"><input type="checkbox"> Billets Eurostar</label><label class="check"><input type="checkbox"> Carte bancaire + un peu de livres sterling</label><label class="check"><input type="checkbox"> Téléphone + chargeur</label><label class="check"><input type="checkbox"> Batterie externe</label><label class="check"><input type="checkbox"> Écouteurs</label><label class="check"><input type="checkbox"> Vêtements chauds pour Londres</label><label class="check"><input type="checkbox"> Imperméable / parapluie</label><label class="check"><input type="checkbox"> Chaussures confortables</label><label class="check"><input type="checkbox"> Trousse de toilette</label><label class="check"><input type="checkbox"> Médicaments personnels</label><label class="check"><input type="checkbox"> Sac à dos pour les journées</label><label class="check"><input type="checkbox"> Gourde</label><label class="check"><input type="checkbox"> Lunettes de soleil</label>
              </div><div class="packing-hint">☑️ Les cases sont interactives : coche-les quand c'est dans la valise.</div></div></div></div>
            </button>
            <button class="suitcase-card" type="button" aria-expanded="false" aria-controls="packing-cecile" onclick="toggleCase(this)">
              <div class="case-shell green"><div class="case-handle"></div><div class="case-body"><div class="case-icon">🍃</div><div class="case-name">Cécile</div><div class="case-lock"></div></div><div class="case-open">ouvrir la valise · +</div></div>
              <div class="packing" id="packing-cecile"><div class="packing-inner"><div class="packing-box"><h3>La valise de Cécile 🍃</h3><div class="checklist">
                <label class="check"><input type="checkbox"> Passeport / pièce d'identité</label><label class="check"><input type="checkbox"> Billets Eurostar</label><label class="check"><input type="checkbox"> Carte bancaire + un peu de livres sterling</label><label class="check"><input type="checkbox"> Téléphone + chargeur</label><label class="check"><input type="checkbox"> Batterie externe</label><label class="check"><input type="checkbox"> Écouteurs</label><label class="check"><input type="checkbox"> Vêtements chauds pour Londres</label><label class="check"><input type="checkbox"> Imperméable / parapluie</label><label class="check"><input type="checkbox"> Chaussures confortables</label><label class="check"><input type="checkbox"> Trousse de toilette</label><label class="check"><input type="checkbox"> Médicaments personnels</label><label class="check"><input type="checkbox"> Sac à dos pour les journées</label><label class="check"><input type="checkbox"> Gourde</label><label class="check"><input type="checkbox"> Lunettes de soleil</label>
              </div><div class="packing-hint">☑️ Les cases sont interactives : coche-les quand c'est dans la valise.</div></div></div></div>
            </button>
            <button class="suitcase-card" type="button" aria-expanded="false" aria-controls="packing-soa" onclick="toggleCase(this)">
              <div class="case-shell terra"><div class="case-handle"></div><div class="case-body"><div class="case-icon">🍂</div><div class="case-name">Soa</div><div class="case-lock"></div></div><div class="case-open">ouvrir la valise · +</div></div>
              <div class="packing" id="packing-soa"><div class="packing-inner"><div class="packing-box"><h3>La valise de Soa 🍂</h3><div class="checklist">
                <label class="check"><input type="checkbox"> Passeport / pièce d'identité</label><label class="check"><input type="checkbox"> Billets Eurostar</label><label class="check"><input type="checkbox"> Carte bancaire + argent de poche</label><label class="check"><input type="checkbox"> Téléphone + chargeur</label><label class="check"><input type="checkbox"> Batterie externe</label><label class="check"><input type="checkbox"> Écouteurs</label><label class="check"><input type="checkbox"> Vêtements chauds pour Londres</label><label class="check"><input type="checkbox"> Imperméable / parapluie</label><label class="check"><input type="checkbox"> Chaussures confortables</label><label class="check"><input type="checkbox"> Trousse de toilette</label><label class="check"><input type="checkbox"> Médicaments personnels</label><label class="check"><input type="checkbox"> Sac à dos pour les journées</label><label class="check"><input type="checkbox"> Gourde</label><label class="check"><input type="checkbox"> Livre / Kindle pour le train</label>
              </div><div class="packing-hint">☑️ Les cases sont interactives : coche-les quand c'est dans la valise.</div></div></div></div>
            </button>
          </div>
          </section>
          '''
          marker = '</main><footer>'
          s = s.replace(marker, section + '\n</main><footer>', 1)

          js = r'''
          <script>
          function toggleCase(card){
            const open = card.classList.toggle('open');
            card.setAttribute('aria-expanded', open ? 'true' : 'false');
            const label = card.querySelector('.case-open');
            if(label) label.textContent = open ? 'fermer la valise · −' : 'ouvrir la valise · +';
          }
          </script>
          '''
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m "Ajoute les valises interactives"
          git rm .github/workflows/add-suitcases.yml
          git commit -m "Supprime le workflow temporaire valises" || true
          git push
