name: Reconnect travel menus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconnect:
    if: "!contains(github.event.head_commit.message, 'Reconnect travel menus automatically')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the shared side menu on every travel page
        shell: python
        run: |
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              if p.name in {'index.html', 'final.html'}:
                  continue
              s = p.read_text(encoding='utf-8')
              css = '<link rel="stylesheet" href="menu.css">'
              js = '<script src="menu.js"></script>'
              if css not in s:
                  s = s.replace('</head>', css + '</head>', 1)
              if js not in s:
                  s = s.replace('</body>', js + '</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Restore the complete activities list and keep Liberty
        shell: python
        run: |
          from pathlib import Path
          p = Path('final.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section class="section alt" id="activites">')
          if start == -1:
              raise SystemExit('Activities section not found')
          end = s.find('</section>', start) + len('</section>')
          cards = '''<section class="section alt" id="activites"><div class="eyebrow">À ne pas oublier</div><h2 class="title">Les activités à faire.</h2><p class="note">✨ Toutes les activités enregistrées dans notre carnet sont conservées ici. Liberty London a été ajouté en plus, sans supprimer les autres.</p><div class="grid"><article class="card"><span>🌉</span><h2>Tower Bridge & Thames</h2><p>St Katharine Docks, Tower Bridge et la Tamise.</p><span class="go">East London</span></article><article class="card"><span>🔔</span><h2>Big Ben & Westminster</h2><p>Westminster Palace, Elizabeth Tower et Westminster Bridge.</p><span class="go">Westminster</span></article><article class="card"><span>👑</span><h2>Buckingham Palace</h2><p>Palais royal et balade dans St James's Park.</p><span class="go">Westminster</span></article><article class="card"><span>🐑</span><h2>Hackney City Farm</h2><p>Ferme incontournable au cœur de Hackney.</p><span class="go">East London</span></article><article class="card"><span>🧱</span><h2>Brick Lane & Shoreditch</h2><p>Street art, boutiques vintage, cafés et ambiance East London.</p><span class="go">East London</span></article><article class="card"><span>☕</span><h2>Queen's Wood Cafe</h2><p>Café cosy au bord de Queen's Wood.</p><span class="go">North London</span></article><article class="card"><span>🌳</span><h2>Queen's Wood</h2><p>Promenade dans les bois avec une vraie ambiance automnale.</p><span class="go">Highgate</span></article><article class="card"><span>🌿</span><h2>Hollyhock Cafe</h2><p>Café végétarien Fairtrade dans les Terrace Gardens de Richmond.</p><span class="go">Richmond</span></article><article class="card"><span>🌳</span><h2>Richmond & Richmond Park</h2><p>Balade nature et grands espaces dans l'ouest de Londres.</p><span class="go">Richmond</span></article><article class="card"><span>🌸</span><h2>Neal's Yard & Covent Garden</h2><p>Petites boutiques, photos, cafés et jolies rues du centre.</p><span class="go">Covent Garden</span></article><article class="card"><span>🏛️</span><h2>British Museum</h2><p>Grande visite culturelle dans le centre.</p><span class="go">Bloomsbury</span></article><article class="card"><span>🎃</span><h2>Halloween at Kew</h2><p>Trail Halloween illuminé à Kew Gardens, à placer en fin de journée.</p><span class="go">Halloween</span></article><article class="card"><span>🪄</span><h2>Dark Arts</h2><p>Expérience Halloween du Warner Bros. Studio Tour London.</p><span class="go">Harry Potter</span></article><article class="card"><span>🎃</span><h2>London Dungeon</h2><p>Expérience immersive horrifique au cœur de Londres.</p><span class="go">Halloween</span></article><article class="card"><span>🌳</span><h2>Greenwich Park</h2><p>Parc, panorama et balade dans Greenwich.</p><span class="go">South East London</span></article><article class="card"><span>🌆</span><h2>Sky Garden</h2><p>Vue panoramique sur Londres depuis la City.</p><span class="go">City</span></article><article class="card"><span>🛍️</span><h2>Camden Market</h2><p>Marché emblématique, street food et boutiques.</p><span class="go">North London</span></article><article class="card"><span>🛍️</span><h2>Portobello Road Market</h2><p>Marché, antiquités et balade à Notting Hill.</p><span class="go">Notting Hill</span></article><article class="card"><span>🌺</span><h2>Kyoto Garden</h2><p>Petit jardin japonais paisible à Holland Park.</p><span class="go">Holland Park</span></article><article class="card"><span>🏰</span><h2>Tower of London</h2><p>Forteresse historique sur les bords de la Tamise.</p><span class="go">Tower Hill</span></article><article class="card"><span>✨</span><h2>Hexmoor</h2><p>Une idée d'expérience conservée dans le carnet.</p><span class="go">À confirmer</span></article><article class="card"><span>🛍️</span><h2>Liberty London</h2><p>Grand magasin iconique de Regent Street : tissus Liberty, mode, beauté et décoration.</p><span class="go">Regent Street · Oxford Circus</span></article></div></section>'''
          s = s[:start] + cards + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit only the menu and activity corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Reconnect travel menus automatically"
          git push
