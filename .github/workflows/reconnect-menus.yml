name: Reconnect travel menus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconnect:
    if: "!contains(github.event.head_commit.message, 'Reconnect travel menus automatically')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the shared side menu on every travel page
        shell: python
        run: |
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              if p.name in {'index.html', 'final.html'}:
                  continue
              s = p.read_text(encoding='utf-8')
              css = '<link rel="stylesheet" href="menu.css">'
              js = '<script src="menu.js"></script>'
              if css not in s:
                  s = s.replace('</head>', css + '</head>', 1)
              if js not in s:
                  s = s.replace('</body>', js + '</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit only the menu connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Reconnect travel menus automatically"
          git push
