name: Reconnect travel menus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconnect:
    if: "!contains(github.event.head_commit.message, 'Reconnect travel menus automatically')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the shared side menu on every travel page
        shell: python
        run: |
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              if p.name in {'index.html', 'final.html'}:
                  continue
              s = p.read_text(encoding='utf-8')
              css = '<link rel="stylesheet" href="menu.css">'
              js = '<script src="menu.js"></script>'
              if css not in s:
                  s = s.replace('</head>', css + '</head>', 1)
              if js not in s:
                  s = s.replace('</body>', js + '</body>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Add the complete new wishlist to activities and days
        shell: python
        run: |
          from pathlib import Path

          # --- ACTIVITIES: append, never replace the existing cards ---
          p = Path('final.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section class="section alt" id="activites">')
          if start == -1:
              raise SystemExit('Activities section not found')
          close = s.find('</div></section>', start)
          if close == -1:
              raise SystemExit('Activities grid not found')
          new_cards = '''<article class="card"><span>🌸</span><h2>Diptyque · Marylebone</h2><p>Boutique Diptyque à Marylebone.</p><span class="go">Marylebone</span></article><article class="card"><span>🛍️</span><h2>Portobello Market</h2><p>Marché emblématique de Notting Hill.</p><span class="go">Notting Hill</span></article><article class="card"><span>🛁</span><h2>Bath & Body Works</h2><p>Boutique parfums, soins et bougies.</p><span class="go">Shopping</span></article><article class="card"><span>🎡</span><h2>Leicester Square</h2><p>Place animée du West End.</p><span class="go">West End</span></article><article class="card"><span>🍭</span><h2>Hans & Gretel</h2><p>Adresse gourmande à l'univers très féerique.</p><span class="go">Gourmand</span></article><article class="card"><span>🫖</span><h2>Fortnum & Mason</h2><p>Institution londonienne pour le thé, l'épicerie fine et les cadeaux.</p><span class="go">Piccadilly</span></article><article class="card"><span>💄</span><h2>Glossier</h2><p>Boutique beauté à Londres.</p><span class="go">Beauté</span></article><article class="card"><span>💊</span><h2>Boots</h2><p>Drugstore britannique iconique.</p><span class="go">Shopping</span></article><article class="card"><span>🍵</span><h2>TWG Tea</h2><p>Maison de thé à découvrir pendant le shopping.</p><span class="go">Tea time</span></article><article class="card"><span>📚</span><h2>Maison Assouline</h2><p>Librairie et espace culturel très esthétique.</p><span class="go">Piccadilly</span></article><article class="card"><span>🏷️</span><h2>TK Maxx</h2><p>Shopping à prix réduits.</p><span class="go">Shopping</span></article><article class="card"><span>👗</span><h2>Urban Revivo</h2><p>Boutique mode à intégrer au parcours shopping.</p><span class="go">Mode</span></article><article class="card"><span>💿</span><h2>FOPP</h2><p>Disques, films et culture pop.</p><span class="go">Soho / Centre</span></article><article class="card"><span>📖</span><h2>Daunt Books</h2><p>Librairie londonienne emblématique.</p><span class="go">Marylebone</span></article><article class="card"><span>🪄</span><h2>Hexmoor Wizarding Prison</h2><p>Expérience à conserver dans le carnet.</p><span class="go">Wizarding</span></article><article class="card"><span>🌊</span><h2>Seven Sisters</h2><p>Falaises et côte anglaise pour une excursion hors Londres.</p><span class="go">Day trip</span></article><article class="card"><span>🎃</span><h2>London's Free Pumpkin Festival</h2><p>Événement automnal à placer selon les dates et horaires 2026.</p><span class="go">Automne</span></article><article class="card"><span>🌿</span><h2>Yorkshire</h2><p>Projet d'escapade hors Londres à conserver dans les idées.</p><span class="go">Day trip</span></article><article class="card"><span>☕</span><h2>Abuelo</h2><p>Café à découvrir pendant le parcours.</p><span class="go">Café</span></article><article class="card"><span>🥐</span><h2>Leigh's</h2><p>Adresse gourmande à intégrer au parcours.</p><span class="go">Food</span></article><article class="card"><span>☕</span><h2>The Host Café</h2><p>Café à découvrir pendant le séjour.</p><span class="go">Café</span></article><article class="card"><span>☕</span><h2>Eve</h2><p>Adresse à intégrer au parcours.</p><span class="go">Café / food</span></article><article class="card"><span>🥯</span><h2>Gail's</h2><p>Boulangerie-café britannique.</p><span class="go">Breakfast / coffee</span></article><article class="card"><span>🌺</span><h2>Clifton Nurseries Café</h2><p>Café au cœur d'une pépinière londonienne.</p><span class="go">Little Venice</span></article><article class="card"><span>🌊</span><h2>Nevo River Walk</h2><p>Balade au bord de l'eau à intégrer selon le parcours retenu.</p><span class="go">Walk</span></article><article class="card"><span>🌳</span><h2>Regent's Park</h2><p>Grand parc royal au nord du centre.</p><span class="go">North London</span></article><article class="card"><span>🌺</span><h2>Kyoto Garden</h2><p>Jardin japonais à Holland Park.</p><span class="go">Holland Park</span></article><article class="card"><span>⛰️</span><h2>Primrose Hill</h2><p>Point de vue emblématique sur Londres.</p><span class="go">Regent's Park</span></article><article class="card"><span>🌿</span><h2>Holland Park</h2><p>Parc et jardins du west London.</p><span class="go">West London</span></article><article class="card"><span>🛶</span><h2>Little Venice</h2><p>Canaux, péniches et balade paisible.</p><span class="go">Maida Vale</span></article><article class="card"><span>🛍️</span><h2>Notting Hill</h2><p>Quartier coloré et balade autour de Portobello.</p><span class="go">West London</span></article><article class="card"><span>🛍️</span><h2>Camden Market</h2><p>Marché, street food et boutiques.</p><span class="go">North London</span></article><article class="card"><span>🌸</span><h2>Covent Garden</h2><p>Marché couvert, boutiques et animations de rue.</p><span class="go">Central London</span></article><article class="card"><span>🌸</span><h2>Neal's Yard</h2><p>Petite cour colorée cachée à Covent Garden.</p><span class="go">Covent Garden</span></article><article class="card"><span>🎭</span><h2>Soho</h2><p>Quartier animé, boutiques, restaurants et cafés.</p><span class="go">West End</span></article><article class="card"><span>🥢</span><h2>Chinatown</h2><p>Quartier asiatique au cœur du West End.</p><span class="go">West End</span></article><article class="card"><span>🔔</span><h2>Big Ben</h2><p>Icône de Westminster au bord de la Tamise.</p><span class="go">Westminster</span></article><article class="card"><span>🌉</span><h2>Tower Bridge</h2><p>Pont emblématique de Londres.</p><span class="go">Tower Hill</span></article>'''
          s = s[:close] + new_cards + s[close:]
          p.write_text(s, encoding='utf-8')

          # --- DAYS: place the new wishlist into the existing day-by-day route ---
          p = Path('journees.html')
          s = p.read_text(encoding='utf-8')
          additions = {
            'Jeudi 22 octobre': [('🛍️','Première soirée · Tower Bridge / St Katharine Docks','Tower Bridge, déjà prévu, reste prioritaire pour l’arrivée. Ajouter une première étape shopping légère si l’énergie le permet.')],
            'Vendredi 23 octobre': [('👑','Westminster · Big Ben · St James Park · relève de la garde','Ajouter la relève de la garde à la séquence Westminster/Buckingham, puis enchaîner St James Park.'),('🛍️','Piccadilly · Fortnum & Mason · Maison Assouline · TWG · Glossier · Boots','Regrouper ces adresses dans le même parcours shopping autour de Piccadilly/Regent Street.'),('🎭','Leicester Square · Soho · Chinatown','Poursuivre à pied depuis Piccadilly vers Leicester Square, Soho et Chinatown.')],
            'Samedi 24 octobre': [('🐑','Hackney City Farm · Brick Lane · Shoreditch','Conserver Hackney City Farm comme incontournable puis ajouter les adresses shopping/restauration de l’East End.'),('👗','Urban Revivo · TK Maxx · FOPP','À placer dans les créneaux shopping du centre/West End selon les boutiques retenues.')],
            'Dimanche 25 octobre': [('☕','Queen’s Wood · Queen’s Wood Cafe','Conserver ces deux étapes comme incontournables.'),('🌳','Regent’s Park · Primrose Hill','Poursuivre vers Regent’s Park et Primrose Hill si le temps le permet.'),('📚','Daunt Books · Diptyque Marylebone · Gail’s','Regrouper les adresses de Marylebone autour de Daunt Books, Diptyque et Gail’s.'),('🌺','Clifton Nurseries Cafe · Little Venice','Ajouter la pause à Clifton Nurseries et la balade vers Little Venice.')],
            'Lundi 26 octobre': [('🌿','Hollyhock Cafe · Richmond Park','Conserver Hollyhock et Richmond Park comme étapes prioritaires.'),('🌊','Nevo River Walk','Ajouter la promenade au bord de l’eau dans le parcours Richmond.'),('🌺','Holland Park · Kyoto Garden','Ajouter Holland Park et Kyoto Garden sur le trajet de retour si le temps le permet.'),('🛍️','Notting Hill · Portobello Market','Prévoir le passage à Notting Hill et Portobello Market dans la partie ouest de la journée.')],
            'Mardi 27 octobre': [('🌸','Covent Garden · Neal’s Yard','Conserver et détailler ces étapes dans la matinée.'),('🛍️','Bath & Body Works · Liberty London · Glossier · Boots','Regrouper le shopping autour du centre/Regent Street.'),('📚','British Museum','Conserver la visite culturelle.'),('☕','Abuelo · Leigh’s · The Host Café · Eve','Adresses cafés/restauration à choisir selon la proximité du parcours et les horaires.')],
            'Mercredi 28 octobre': [('🎃','London’s Free Pumpkin Festival','À placer en fin d’après-midi/soirée selon les horaires 2026.'),('🪄','Hexmoor Wizarding Prison','À placer dans le bloc Halloween/immersif de fin de journée.'),('🍭','Hans & Gretel','Pause gourmande à placer avant ou après l’activité Halloween.')],
            'Jeudi 29 octobre': [('🌊','Seven Sisters','Excursion hors Londres à conserver comme option de journée distincte si elle est retenue.'),('🌿','Yorkshire','Projet d’escapade hors Londres à conserver dans le carnet ; incompatible avec Seven Sisters le même jour, donc à traiter comme journée/extension séparée.')]
          }
          # Also make sure the exact standalone places requested appear in the day section.
          for heading, items in additions.items():
              marker = '<section class="day"><h2>' + heading
              pos = s.find(marker)
              if pos == -1:
                  continue
              nxt = s.find('<section class="day">', pos + 1)
              end = nxt if nxt != -1 else s.find('</main>', pos)
              block = s[pos:end]
              if 'Nouvelles adresses ajoutées' in block:
                  continue
              cards = '<div class="activity"><span class="tag">Nouvelles adresses ajoutées</span>'
              for icon, title, desc in items:
                  cards += f'<h3>{icon} {title}</h3><p>{desc}</p>'
              cards += '</div>'
              insert_at = block.rfind('</section>')
              if insert_at != -1:
                  block = block[:insert_at] + cards + block[insert_at:]
                  s = s[:pos] + block + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit the additions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Reconnect travel menus automatically"
          git push
