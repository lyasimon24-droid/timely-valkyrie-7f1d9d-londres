name: Make every menu interactive

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add thematic menu transitions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css=r'''
          /* THEMATIC MENU TRANSITIONS */
          #menu-transition{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .35s;background:#10171c}
          #menu-transition.show{opacity:1}.transition-title{font:600 clamp(42px,8vw,90px) 'Cormorant Garamond';color:#f4e7d5;text-align:center;text-shadow:0 4px 30px #000}
          .travel-particle{position:absolute;pointer-events:none;animation:particleMove 1.5s ease-in forwards;font-size:var(--size)}@keyframes particleMove{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
          .menu-active{animation:sectionReveal .8s ease both}@keyframes sectionReveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
          .interactive-badge{display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:9px 13px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff22;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
          '''
          s=s.replace('</style>',css+'</style>',1)
          if 'id="menu-transition"' not in s:
              s=s.replace('<div id="top"></div>','<div id="top"></div><div id="menu-transition" aria-hidden="true"><div class="transition-title"></div></div>',1)
          js=r'''
          <script>
          const menuThemes={
            participants:{title:'Les voyageurs ✈️',chars:['✈️','☁️','💌','♡'],bg:'#263f4b'},
            trajets:{title:'En route… 🚆',chars:['🚆','💨','🎫','→'],bg:'#243d42'},
            activites:{title:'London calling ✨',chars:['☕','🎡','🎨','🎟️'],bg:'#4a3b31'},
            journees:{title:'Notre carnet de route 🗓️',chars:['☀️','☕','📍','→'],bg:'#3f493b'},
            logement:{title:'Home sweet home 🏠',chars:['🔑','🕯️','🛏️','♡'],bg:'#40352f'},
            budget:{title:'Les comptes du voyage £',chars:['£','£','🪙','✦'],bg:'#344337'},
            valise:{title:'On prépare les valises 🧳',chars:['🧳','👗','👟','🎀'],bg:'#493b43'},
            halloween:{title:'After dark… 🎃',chars:['🦇','🌙','🕯️','🧙‍♀️'],bg:'#17121d'}
          };
          function menuKey(h){return (h||'').replace('#','').toLowerCase()}
          function launchMenuTransition(key){
            if(key==='top') return;
            const t=document.getElementById('menu-transition'),title=t?.querySelector('.transition-title'); if(!t||!title)return;
            const d=menuThemes[key]||{title:'London ✨',chars:['✦'],bg:'#27352f'}; t.style.background=d.bg; title.textContent=d.title; t.classList.add('show');
            for(let i=0;i<34;i++){const p=document.createElement('span');p.className='travel-particle';p.textContent=d.chars[i%d.chars.length];p.style.left=Math.random()*100+'vw';p.style.top=Math.random()*100+'vh';p.style.setProperty('--dx',(Math.random()*70-35)+'vw');p.style.setProperty('--dy',(Math.random()*70-35)+'vh');p.style.setProperty('--rot',(Math.random()*300-150)+'deg');p.style.setProperty('--size',(12+Math.random()*28)+'px');p.style.animationDelay=(Math.random()*.25)+'s';t.appendChild(p)}
            setTimeout(()=>{t.classList.remove('show');t.querySelectorAll('.travel-particle').forEach(x=>x.remove())},1250);
          }
          document.addEventListener('DOMContentLoaded',()=>{
            document.querySelectorAll('a[href^="#"]').forEach(a=>{
              const key=menuKey(a.getAttribute('href'));
              if(menuThemes[key]) a.addEventListener('click',e=>{ if(key==='halloween') return; e.preventDefault(); launchMenuTransition(key); setTimeout(()=>document.getElementById(key)?.scrollIntoView({behavior:'smooth',block:'start'}),650); });
            });
          });
          </script>
          '''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m "Rend tous les menus interactifs et thematiques"
          git rm .github/workflows/add-interactive-menus.yml
          git commit -m "Supprime le workflow interactif temporaire" || true
          git push
