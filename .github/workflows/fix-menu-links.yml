name: Fix travel menu links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix broken travel menu links')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair menu destinations and restore section anchors
        shell: python
        run: |
          from pathlib import Path

          p = Path('final.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'href="#trajets"': 'href="journees.html#trajets"',
              'href="#journees"': 'href="journees.html#journees"',
              'href="#logement"': 'href="journees.html#logement"',
              'href="#budget"': 'href="payer-londres.html"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('journees.html')
          s = p.read_text(encoding='utf-8')
          if 'id="trajets"' not in s:
              s = s.replace('<section class="intro">', '<section class="intro" id="trajets">', 1)
          if 'id="journees"' not in s:
              s = s.replace('<h1>Heure par heure.</h1>', '<h1 id="journees">Heure par heure.</h1>', 1)
          if 'id="logement"' not in s:
              marker = 'Point de départ du séjour :'
              s = s.replace(marker, '<span id="logement"></span>' + marker, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final.html journees.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix broken travel menu links"
          git push
