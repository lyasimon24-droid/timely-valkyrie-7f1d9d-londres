name: Remove Jack l'Éventreur

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Jack l'Éventreur from the site
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<li>Jack l\'Éventreur · visite en soirée</li>\n', '')
          s = s.replace(' → Jack l\'Éventreur 🎃', ' 🎃')
          s = s.replace('<div class="slot"><b>19h00–21h00</b>🎃 Visite Jack l\'Éventreur en français, si le créneau est réservé.</div>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-jack.yml
          git add index.html
          git diff --cached --quiet || git commit -m "Retire Jack l'Éventreur du programme"
          git push
