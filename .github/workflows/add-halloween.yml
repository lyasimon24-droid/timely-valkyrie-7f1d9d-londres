name: Add interactive Halloween section

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add spooky Halloween section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css=r'''
          .halloween{background:radial-gradient(circle at 20% 10%,#4a2930 0,#1c1720 38%,#111117 100%);color:#eee5d8;position:relative;overflow:hidden}
          .halloween:before,.halloween:after{content:'✦';position:absolute;color:#b96532aa;font-size:80px;pointer-events:none}.halloween:before{top:35px;right:8%}.halloween:after{bottom:35px;left:5%;font-size:45px}
          .halloween .title,.halloween .eyebrow{color:#e7b08c}.halloween-intro{max-width:720px;line-height:1.8;color:#d8c9bd}
          .spooky-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
          .spooky-card{background:#241d25;border:1px solid #72505a;border-radius:24px;padding:0;overflow:hidden;box-shadow:0 18px 45px #0008;transition:.3s;position:relative}
          .spooky-card:hover{transform:translateY(-7px) rotate(-.5deg);border-color:#b96532}
          .spooky-head{padding:24px 22px 18px;background:linear-gradient(135deg,#39232b,#211a22);min-height:175px;display:flex;flex-direction:column;justify-content:space-between}
          .spooky-icon{font-size:45px}.spooky-card h3{font:600 34px/1 'Cormorant Garamond';color:#f0d4c0;margin:0}.spooky-time{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#c98261}
          .spooky-body{padding:20px;color:#d7c9c0;font-size:12px;line-height:1.7}.spooky-body p{margin-top:0}.spooky-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.spooky-link{padding:9px 11px;border-radius:999px;background:#3a2b31;color:#efc1a6;font-size:9px;text-transform:uppercase}
          .spooky-check{display:flex;align-items:center;gap:9px;margin-top:15px;padding:11px;background:#2e252d;border-radius:12px;color:#e7d8cd;font-size:11px;cursor:pointer}.spooky-check input{accent-color:#b96532;width:17px;height:17px}.spooky-check:has(input:checked){opacity:.5;text-decoration:line-through}
          .haunted-note{margin-top:22px;padding:17px;border:1px solid #6f4c55;background:#241c24;border-radius:15px;color:#d7c8bd;font-size:11px;line-height:1.7}
          .bat{display:inline-block;animation:floatbat 3s ease-in-out infinite}@keyframes floatbat{50%{transform:translateY(-7px) rotate(-3deg)}}
          @media(max-width:900px){.spooky-grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.spooky-grid{grid-template-columns:1fr}}
          '''
          s=s.replace('</style>',css+'</style>',1)

          nav='<a href="#valise"><span class="ico">🧳</span>Valise</a>'
          if '<a href="#halloween"><span class="ico">🎃</span>Halloween</a>' not in s:
              s=s.replace(nav,nav+'\n<a href="#halloween"><span class="ico">🎃</span>Halloween</a>',1)

          menu='<a class="card" href="#valise">07 🧳<h2>La valise</h2><span class="go">ouvrir →</span></a>'
          if '<a class="card" href="#halloween">08 🎃' not in s:
              s=s.replace(menu,menu+'<a class="card" href="#halloween">08 🎃<h2>Halloween</h2><span class="go">ouvrir →</span></a>',1)

          section=r'''
          <section class="halloween" id="halloween">
          <div class="eyebrow">08 · Halloween à Londres</div>
          <h2 class="title">After dark. 🎃</h2>
          <p class="halloween-intro">Une partie dédiée à nos activités Halloween, avec une ambiance un peu plus spooky 🕯️. Les activités Halloween sont placées en <b>fin d'après-midi ou le soir</b>, comme prévu. Clique sur une activité pour voir les détails, les horaires prévus et les liens utiles.</p>
          <div class="spooky-grid">
            <article class="spooky-card"><div class="spooky-head"><span class="spooky-icon bat">🦇</span><span class="spooky-time">Dimanche 25 · 17h00</span><h3>Hexmoor</h3></div><div class="spooky-body"><p>Expérience immersive et mystérieuse à intégrer après Hackney City Farm et Brick Lane. Prévoir une arrivée avant le début du créneau.</p><div class="spooky-links"><a class="spooky-link" href="https://www.google.com/maps/search/?api=1&query=Hexmoor+London" target="_blank">📍 Google Maps ↗</a><a class="spooky-link" href="https://hexmoor.co.uk/" target="_blank">🌐 Site ↗</a></div><label class="spooky-check"><input type="checkbox"> 🎟️ Réservation vérifiée</label></div></article>
            <article class="spooky-card"><div class="spooky-head"><span class="spooky-icon">🌙</span><span class="spooky-time">Lundi 26 · à partir de 16h</span><h3>Halloween at Kew</h3></div><div class="spooky-body"><p>La parenthèse Halloween de Kew Gardens, programmée après la visite des jardins. Une activité pensée pour basculer doucement dans l'ambiance du soir.</p><div class="spooky-links"><a class="spooky-link" href="https://www.google.com/maps/search/?api=1&query=Kew+Gardens+London" target="_blank">📍 Google Maps ↗</a><a class="spooky-link" href="https://www.kew.org/kew-gardens/whats-on/halloween-at-kew" target="_blank">🌐 Site officiel ↗</a></div><label class="spooky-check"><input type="checkbox"> 🎟️ Réservation vérifiée</label></div></article>
            <article class="spooky-card"><div class="spooky-head"><span class="spooky-icon">🕯️</span><span class="spooky-time">Ambiance · en soirée</span><h3>London by night</h3></div><div class="spooky-body"><p>Après les activités réservées, garder une petite balade nocturne dans Londres : rues illuminées, vitrines Halloween et quartiers animés. Sans ajouter une réservation obligatoire.</p><div class="spooky-links"><a class="spooky-link" href="https://www.google.com/maps/search/?api=1&query=Leicester+Square+London" target="_blank">📍 Leicester Square</a></div><label class="spooky-check"><input type="checkbox"> 🕸️ À faire si on a encore de l'énergie</label></div></article>
          </div>
          <div class="haunted-note"><span class="bat">🦇</span> <b>Notre règle spooky :</b> pas d'activité Halloween en plein milieu de matinée. On garde les frissons pour la fin de journée et le soir. Les créneaux affichés sont ceux prévus dans notre itinéraire et doivent être confirmés lors de la réservation.</div>
          </section>
          '''
          if 'id="halloween"' not in s:
              s=s.replace('</main><footer>',section+'\n</main><footer>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m "Ajoute une section Halloween interactive et spooky"
          git rm .github/workflows/add-halloween.yml
          git commit -m "Supprime le workflow Halloween temporaire" || true
          git push
