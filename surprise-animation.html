<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✨ La surprise</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d0b;color:#fff}.letters{position:fixed;inset:0;overflow:hidden;pointer-events:none}.letter{position:absolute;top:-140px;width:82px;height:58px;background:#f5f0e6;border:2px solid #c7bda9;border-radius:5px;box-shadow:0 7px 18px #0008;transform:rotate(var(--r));animation:fall var(--d) linear var(--delay) forwards}.letter:before{content:'✉';position:absolute;inset:0;display:grid;place-items:center;color:#725c42;font-size:28px}.letter:after{content:'';position:absolute;left:0;right:0;top:0;height:50%;border-bottom:2px solid #c7bda9;clip-path:polygon(0 0,50% 100%,100% 0)}@keyframes fall{0%{transform:translateY(-150px) rotate(var(--r));opacity:0}8%{opacity:1}100%{transform:translateY(115vh) rotate(calc(var(--r) + 360deg));opacity:1}}#reveal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:#090909;opacity:0;transition:opacity 1.4s ease}#reveal.show{opacity:1}#reveal img{width:100vw;height:100vh;object-fit:contain;display:block}.credit{position:fixed;left:10px;bottom:8px;font:10px Arial,sans-serif;color:#fff9;background:#0008;padding:4px 7px;border-radius:6px}.intro{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle,#243a30,#080d0b 70%);transition:opacity 1s}.intro.hide{opacity:0;pointer-events:none}.intro h1{font:clamp(36px,8vw,72px) Georgia,serif;margin:12px}.intro p{opacity:.8}.skip{position:fixed;z-index:20;right:15px;bottom:15px;background:#fff;color:#111;border:0;border-radius:999px;padding:9px 14px;opacity:.55}</style></head><body><div class="intro" id="intro"><div>✉️</div><h1>Une dernière livraison...</h1><p>Attendez-vous à ce que le courrier soit légèrement abondant.</p></div><div class="letters" id="letters"></div><div id="reveal"><img src="https://i.pinimg.com/736x/55/89/b4/5589b450e4f39c29d1eee1e219701f2f.jpg" alt="Lettre d'admission à Poudlard"><div class="credit">Lettre d'admission à Poudlard</div></div><button class="skip" id="skip">Passer</button><script>const box=document.getElementById('letters');const count=260;for(let i=0;i<count;i++){const e=document.createElement('div');e.className='letter';e.style.left=Math.random()*100+'vw';e.style.setProperty('--r',(Math.random()*70-35)+'deg');e.style.setProperty('--d',(3.8+Math.random()*3.8)+'s');e.style.setProperty('--delay',(Math.random()*3.2)+'s');box.appendChild(e)}setTimeout(()=>document.getElementById('intro').classList.add('hide'),1200);setTimeout(()=>{box.style.display='none';const r=document.getElementById('reveal');r.style.display='flex';requestAnimationFrame(()=>r.classList.add('show'));setTimeout(()=>location.href='secret-menu.html',6000)},7000);document.getElementById('skip').onclick=()=>location.href='secret-menu.html';</script></body></html>
