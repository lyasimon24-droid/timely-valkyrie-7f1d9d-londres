<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✨ Une surprise</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070807;color:#fff;font-family:Georgia,serif}.letters{position:fixed;inset:0;overflow:hidden;pointer-events:none}.letter{position:absolute;top:-140px;width:92px;height:65px;background:#f5f0e6;border:2px solid #c7bda9;border-radius:5px;box-shadow:0 7px 18px #0008;transform:rotate(var(--r));animation:fall var(--d) linear var(--delay) forwards}.letter:before{content:'✉';position:absolute;inset:0;display:grid;place-items:center;color:#725c42;font-size:30px}.letter:after{content:'';position:absolute;left:0;right:0;top:0;height:50%;border-bottom:2px solid #c7bda9;clip-path:polygon(0 0,50% 100%,100% 0)}@keyframes fall{0%{transform:translateY(-150px) rotate(var(--r));opacity:0}8%{opacity:1}100%{transform:translateY(115vh) rotate(calc(var(--r) + 360deg));opacity:1}}#reveal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:#000;opacity:0;transition:opacity 1.4s ease}#reveal.show{opacity:1}#reveal img{width:100vw;height:100vh;object-fit:cover;display:block}.intro{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle,#243a30,#080d0b 70%);transition:opacity 1s}.intro.hide{opacity:0;pointer-events:none}.intro h1{font-size:clamp(36px,8vw,72px);margin:12px}.intro p{opacity:.8}@media(max-width:700px){.letter{width:70px;height:50px}.letter:before{font-size:23px}}</style><link rel="stylesheet" href="menu.css"></head><body><div class="intro" id="intro"><div style="font-size:42px">✉️</div><h1>Le courrier arrive…</h1><p>Et cette fois, il y en a vraiment beaucoup.</p></div><div class="letters" id="letters"></div><div id="reveal"><img src="https://i.pinimg.com/736x/55/89/b4/5589b450e4f39c29d1eee1e219701f2f.jpg" alt="Lettre d'admission à Poudlard"></div><script>const box=document.getElementById('letters');const count=520;for(let i=0;i<count;i++){const e=document.createElement('div');e.className='letter';e.style.left=Math.random()*100+'vw';e.style.setProperty('--r',(Math.random()*70-35)+'deg');e.style.setProperty('--d',(4.2+Math.random()*4.2)+'s');e.style.setProperty('--delay',(Math.random()*2.6)+'s');box.appendChild(e)}setTimeout(()=>document.getElementById('intro').classList.add('hide'),1100);setTimeout(()=>{box.style.display='none';const r=document.getElementById('reveal');r.style.display='flex';requestAnimationFrame(()=>r.classList.add('show'));setTimeout(()=>location.href='secret-menu.html',5200)},7200);</script><script src="menu.js"></script></body></html>
