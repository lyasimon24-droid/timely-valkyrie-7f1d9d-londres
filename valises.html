<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nos valises 🧳</title><style>body{margin:0;background:#eee8df;color:#302a24;font:16px Arial,sans-serif}main{max-width:900px;margin:auto;padding:25px}.hero{background:#31453a;color:white;border-radius:24px;padding:28px}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:20px}.card{background:#fffaf3;border-radius:20px;padding:22px;border:1px solid #d5c7b7}label{display:block;padding:10px 0}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cdbfac;border-radius:10px}button{margin-top:10px;padding:11px 15px;border:0;border-radius:999px;background:#d9e2d5}</style></head><body><main><section class="hero"><h1>🧳 Nos valises</h1><p>Trois valises, trois check-lists indépendantes. Chacun vérifie ses propres affaires : zéro « je croyais que tu l'avais pris ». </p></section><div class="people" id="people"></div></main><script>const names=['Lya','Cécile','Soa'];const root=document.getElementById('people');const common=['Passeport / documents','Téléphone + chargeur','Médicaments personnels','Tenue chaude','Veste imperméable','Chaussures confortables'];names.forEach(n=>{const key='valise_'+n;let saved=JSON.parse(localStorage.getItem(key)||'{}');const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Valise de '+n+'</h2>'+common.map((x,i)=>'<label><input type="checkbox" data-i="'+i+'" '+(saved[i]?'checked':'')+'> '+x+'</label>').join('')+'<input class="extra" placeholder="Ajouter un élément personnel">';card.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{saved[c.dataset.i]=c.checked;localStorage.setItem(key,JSON.stringify(saved))});root.appendChild(card)});</script></body></html>
